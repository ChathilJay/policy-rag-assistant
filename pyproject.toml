[project]
name = "policy-rag"
version = "0.1.0"
description = "A RAG assistant that answers questions about Australian workplace rights from Fair Work Ombudsman documents."
readme = "README.md"
authors = [{ name = "Chathil Vithanage" }]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "pypdf>=7.0.0",
    "qdrant-client>=1.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
